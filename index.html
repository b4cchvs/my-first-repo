<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>鑑定タスク管理</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="app-header">
    <div class="header-left">
      <h1 class="app-title">🔮 鑑定タスク管理</h1>
      <nav class="tabs">
        <button class="tab is-active" data-view="tasks">タスク一覧</button>
        <button class="tab" data-view="customers">顧客管理</button>
      </nav>
    </div>
    <button id="theme-toggle" class="theme-toggle" title="ダークモード切替">🌙</button>
  </header>

  <main class="app-main">
    <!-- ===== タスク一覧ビュー ===== -->
    <section id="view-tasks" class="view is-active">
      <div class="view-bar">
        <h2 class="view-heading">タスク</h2>
        <button id="new-task-btn" class="btn btn-primary">＋ 新規タスク</button>
      </div>

      <div class="task-columns">
        <div class="task-col">
          <h3 class="col-title">毎日のタスク</h3>
          <ul id="daily-list" class="task-list"></ul>
          <p id="daily-empty" class="empty-state">毎日のタスクはありません。</p>
        </div>
        <div class="task-col">
          <h3 class="col-title">今日のタスク</h3>
          <ul id="today-list" class="task-list"></ul>
          <p id="today-empty" class="empty-state">今日締切のタスクはありません。</p>
        </div>
      </div>

      <section class="calendar-section">
        <div class="cal-head">
          <button id="cal-prev" class="btn btn-sm" aria-label="前の月">‹</button>
          <h3 id="cal-title"></h3>
          <button id="cal-next" class="btn btn-sm" aria-label="次の月">›</button>
        </div>
        <div id="calendar" class="calendar"></div>
        <p class="cal-legend">📅 期限のあるタスクがある日に印が付きます（赤は期限切れ）。日付をクリックで内容を表示。</p>
      </section>
    </section>

    <!-- ===== 顧客管理ビュー ===== -->
    <section id="view-customers" class="view">
      <div class="view-bar">
        <h2 class="view-heading">顧客一覧</h2>
        <button id="new-customer-btn" class="btn btn-primary">＋ 新規顧客</button>
      </div>
      <ul id="customer-list" class="customer-list"></ul>
      <p id="customer-empty" class="empty-state">顧客が登録されていません。「＋ 新規顧客」から追加してください。</p>
    </section>
  </main>

  <!-- ===== モーダル（ポップアップ）共通コンテナ ===== -->
  <div id="modal-overlay" class="modal-overlay" hidden>
    <div class="modal" role="dialog" aria-modal="true">
      <div class="modal-head">
        <h3 id="modal-title" class="modal-title"></h3>
        <button id="modal-close" class="modal-close" aria-label="閉じる">×</button>
      </div>
      <div id="modal-body" class="modal-body"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
